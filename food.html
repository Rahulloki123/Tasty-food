<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Food Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdf6e3;
            text-align: center;
        }
        h1 {
            color: #d35400;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 60%;
        }
        th, td {
            border: 1px solid #d35400;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f39c12;
            color: white;
        }
        img {
            width: 150px;
            height: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>🍽️ Welcome to Lokesh's Food Corner 🍽️</h1>
    <p>Here is our special menu of the day!</p>

    <!-- Food Table -->
    <table>
        <tr>
            <th>Food Item</th>
            <th>Image</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Pizza</td>
            <td><img src="https://upload.wikimedia.org/wikipedia/commons/a/a3/Eq_it-na_pizza-margherita_sep2005_sml.jpg" alt="Pizza"></td>
            <td>₹250</td>
        </tr>
        <tr>
            <td>Biryani</td>
            <td><img src="https://upload.wikimedia.org/wikipedia/commons/f/fd/Biryani_of_Lahore.jpg" alt="Biryani"></td>
            <td>₹180</td>
        </tr>
        <tr>
            <td>Burger</td>
            <td><img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/RedDot_Burger.jpg" alt="Burger"></td>
            <td>₹120</td>
        </tr>
    </table>

    <!-- Order Now Button -->
    <a href="https://www.zomato.com/" target="_blank">
        <button style="padding:10px 20px; background:#e67e22; color:white; border:none; border-radius:5px;">
            Order Now
        </button>
    </a>
</body>
</html>
